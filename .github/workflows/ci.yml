name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Build & test matrix across build tags and platforms ──────────────────────
  test:
    name: "${{ matrix.tags || 'default' }} @ ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stub branches (no build tags): verify compilation of !libvips / !onnx paths.
          # Run on both Linux and Windows to exercise platform-specific files
          # (_unix.go / _windows.go / _linux.go / _other.go).
          - { os: ubuntu-latest,  tags: "" }
          - { os: windows-latest, tags: "" }

          # ONNX detection – pure Go (onnxruntime binding is NOT imported yet,
          # see the TODO in adapters/processor/detection/onnx.go).  Both stub and
          # real code paths are exercised.
          - { os: ubuntu-latest,  tags: "onnx" }
          - { os: windows-latest, tags: "onnx" }

          # libvips – requires CGO + libvips dev libraries.  Runs only on Linux
          # where we can install libvips-dev from the system package manager.
          - { os: ubuntu-latest, tags: "libvips",       cgo: "1", install_libvips: true }
          - { os: ubuntu-latest, tags: "libvips,onnx",  cgo: "1", install_libvips: true }

    env:
      CGO_ENABLED: ${{ matrix.cgo || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Install libvips (Linux)
        if: matrix.install_libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      # ── go vet ──────────────────────────────────────────────────────────
      - name: go vet
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "${TAGS}" ]; then
            go vet -tags="${TAGS}" ./...
          else
            go vet ./...
          fi

      # ── go test ─────────────────────────────────────────────────────────
      - name: go test
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "${TAGS}" ]; then
            go test -tags="${TAGS}" ./... -count=1
          else
            go test ./... -count=1
          fi

      # ── go test -race (Linux only – race detector needs CGO) ────────────
      - name: go test -race
        if: runner.os == 'Linux'
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "${TAGS}" ]; then
            go test -race -tags="${TAGS}" ./... -count=1
          else
            go test -race ./... -count=1
          fi

      # ── Build the final binary ──────────────────────────────────────────
      - name: Build cmd/imager
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "${TAGS}" ]; then
            go build -tags="${TAGS}" -trimpath -ldflags="-s -w" ./cmd/imager
          else
            go build -trimpath -ldflags="-s -w" ./cmd/imager
          fi

  # ── Lint & format (tag-independent, runs once) ──────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  # ── Analysis: govulncheck + fuzz smoke (runs once, after tests pass) ────
  analysis:
    name: Analysis & Fuzz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.0"
          go-package: ./...

      - name: fuzz smoke (FuzzParse)
        run: go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=10s ./domain/asset

      - name: fuzz smoke (FuzzParseSize)
        run: go test -run=^$ -fuzz=^FuzzParseSize$ -fuzztime=10s ./domain/asset

      - name: fuzz smoke (FuzzCleanRelContainment)
        run: go test -run=^$ -fuzz=^FuzzCleanRelContainment$ -fuzztime=10s ./adapters/storage/fs

  # ── Docker: container build + vulnerability scan ────────────────────────
  docker:
    name: Container build + scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: imager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: imager:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
