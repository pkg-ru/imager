name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.0"
          go-package: ./...

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        run: go test -race ./... -count=1

      - name: fuzz smoke (FuzzParse)
        run: go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=10s ./internal/domain/asset

      - name: fuzz smoke (FuzzParseSize)
        run: go test -run=^$ -fuzz=^FuzzParseSize$ -fuzztime=10s ./internal/domain/asset

      - name: fuzz smoke (FuzzCleanRelContainment)
        run: go test -run=^$ -fuzz=^FuzzCleanRelContainment$ -fuzztime=10s ./internal/adapters/storage/fs

      - name: fuzz smoke (FuzzSafeKey)
        run: go test -run=^$ -fuzz=^FuzzSafeKey$ -fuzztime=10s ./internal/adapters/storage/fs

      - name: build (cmd/imager)
        run: go build -trimpath -ldflags="-s -w" ./cmd/imager

  docker:
    name: Container build + scan placeholder
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: imager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: imager:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
