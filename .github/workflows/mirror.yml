name: Mirror to GitVerse

# Зеркалирование GitHub (основной репозиторий) в GitVerse (зеркало).
# Все ветки и теги синхронизируются в gitverse.ru/pkg-ru/imager по PAT.
# Синхронизация односторонняя: только из GitHub в GitVerse, не наоборот.
#
# Публикация Docker Hub (altrap/imager) выполняется в GitHub Actions
# (.github/workflows/docker-release.yml).

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    name: Push refs to GitVerse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Клонируем ВСЕ ветки и теги, чтобы push +refs/heads/* покрыл
          # каждую ветку, а не только текущую (default checkout берёт одну).
          fetch-all: true

      # Синхронизируем только ветки и теги (без refs/remotes и прочего мусора):
      # +refs/remotes/origin/* — force-push всех веток из remote-tracking refs
      #   (actions/checkout создаёт именно их, а не локальные refs/heads/*;
      #   иначе --prune пытается удалить default branch в GitVerse);
      # +refs/tags/* — force-push всех тегов,
      # --prune удаляет в GitVerse ветки/теги, которых больше нет в GitHub.
      # Force-push тега из docker-release.yml тоже попадёт сюда —
      # это безопасно, т.к. Docker Hub публикуется в GitHub, а не в GitVerse.
      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_PAT: ${{ secrets.GITVERSE_PAT }}
        run: |
          git remote add mirror "https://x-access-token:${GITVERSE_PAT}@gitverse.ru/pkg-ru/imager.git"
          git push --prune mirror "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
