services:
  imager:
    build:
      context: ./
      dockerfile: Dockerfile
    image: imager:production
    restart: unless-stopped
    stop_signal: INT
    stop_grace_period: 15s

    # Hardening: non-root (в Dockerfile), dropped capabilities, no-new-privileges,
    # tmpfs для /tmp. read_only: true НЕ используется: при read-only rootfs
    # Docker не создаст mountpoint для bind-mount ./models (каталог лежит в
    # read-only слое). Writable — bind-mounts /etc/imager/models (:rw, сюда
    # entrypoint скачивает модели) и /data/result (:rw); /etc/imager/setting
    # и /data/source монтируются :ro, /tmp — tmpfs.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []

    # Resource limits (обязательные для production).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Liveness — дублирует HEALTHCHECK из Dockerfile.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # Только HTTP (8080); TLS/443 вне production scope.
    ports:
      - "8080:8080"

    volumes:
      # Модели монтируются RW: при старте контейнера entrypoint сам скачивает
      # модели (docker/download-models.sh) в ./models, поэтому файлы сохраняются
      # на хосте и при следующем запуске не перекачиваются. Хост-каталог ./models
      # должен быть доступен на запись uid 10001 (imager) — например chmod -R a+rwX ./models.
      - ./setting:/etc/imager/setting:ro
      - ./models:/etc/imager/models:rw
      - ./data/source:/data/source:ro
      - ./data/result:/data/result:rw

    environment:
      # Путь к каталогу с настройками (обязательный).
      IMAGER_CONFIG_DIR: /etc/imager/setting
      # Каталог с ONNX-моделями, смонтированный из ./models (rw). Используется
      # как каталог автоскачивания (entrypoint) и fallback для
      # detection.face-model / detection.object-model в конфиге: если путь в YAML
      # не задан, он строится как <IMAGER_MODELS_DIR>/<имя_модели>. Явное
      # значение в YAML имеет приоритет.
      IMAGER_MODELS_DIR: /etc/imager/models
      # Источники моделей для автоскачивания при старте (опционально,
      # по умолчанию — официальные OpenCV Zoo / ONNX Model Zoo). Полезно для
      # приватных зеркал или локальных HTTP-кэшей.
      # IMAGER_MODEL_FACE_URL: https://...
      # IMAGER_MODEL_OBJECT_URL: https://...
      # IMAGER_SKIP_MODELS: "0"   # "1" — отключить скачивание (offline)

    networks:
      - default

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.172.100.0/24
