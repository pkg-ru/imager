services:
  imager:
    build:
      context: ./
      dockerfile: Dockerfile
    image: imager:production
    restart: unless-stopped
    stop_signal: INT
    stop_grace_period: 15s

    # Hardening: non-root (в Dockerfile), dropped capabilities, no-new-privileges,
    # tmpfs для /tmp. read_only: true НЕ используется: при read-only rootfs
    # Docker не создаст mountpoint для bind-mount ./models (каталог лежит в
    # read-only слое). Корень остаётся writable, а модели/конфиг монтируются
    # :ro (неизменяемы); writable — только /data и /tmp (tmpfs).
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []

    # Resource limits (обязательные для production).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Liveness — дублирует HEALTHCHECK из Dockerfile.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # Только HTTP (8080); TLS/443 вне production scope.
    ports:
      - "8080:8080"

    # Конфиг монтируется :ro в ОТДЕЛЬНЫЙ каталог /etc/imager/config (нельзя
    # монтировать ./config в /etc/imager — перекроет /etc/imager/models из
    # образа). Модели ./models — отдельно в /etc/imager/models, чтобы обновлять
    # их без пересборки образа (в Dockerfile также запечены копии).
    volumes:
      - ./config:/etc/imager/config:ro
      - ./models:/etc/imager/models:ro
      - ./data/source:/data/source:ro
      - ./data/result:/data/result:rw

    environment:
      # Единственная env-переменная: путь к каталогу с настройками;
      # остальное — в YAML (setting.yaml / setting-local.yaml).
      IMAGER_CONFIG_DIR: /etc/imager/config

    networks:
      - default

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.172.100.0/24
