services:
  imager:
    build:
      context: ./
      dockerfile: Dockerfile
    image: imager:production
    restart: unless-stopped
    stop_signal: INT
    stop_grace_period: 15s

    # Production hardening: non-root (в Dockerfile), dropped capabilities,
    # no-new-privileges, tmpfs для /tmp.
    # ВАЖНО: read_only: true НЕ используется. При read-only rootfs Docker не
    # может создать mountpoint для bind-mount ./models:/etc/imager/models
    # (mkdirat .../etc/imager/models: read-only file system), т.к. каталог
    # лежит в read-only слое. Без read_only rootfs writable, mountpoint
    # создаётся, а сами модели/конфиг монтируются :ro (неизменяемы).
    # Writable остаются только /data и /tmp (tmpfs).
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []

    # Resource limits (обязательные для production).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Healthcheck (liveness) — дублирует HEALTHCHECK из Dockerfile.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # Только HTTP (8080). TLS/443 не включён в production scope.
    ports:
      - "8080:8080"

    # Конфигурация монтируется read-only в ОТДЕЛЬНЫЙ каталог /etc/imager/config.
    # ВАЖНО: нельзя монтировать ./config в /etc/imager — это перекрыло бы
    # /etc/imager/models из образа и не позволило бы создать mountpoint для
    # bind-mount ./models (mkdirat .../etc/imager/models: read-only file system).
    # Модели ONNX монтируются отдельно (./models) в /etc/imager/models, чтобы
    # их можно было обновлять без пересборки образа (в Dockerfile также
    # запечены копии).
    volumes:
      - ./config:/etc/imager/config:ro
      - ./models:/etc/imager/models:ro
      - ./data/source:/data/source:ro
      - ./data/result:/data/result:rw

    environment:
      # Единственная env-переменная: путь к каталогу с настройками.
      # Все остальные настройки — в YAML (setting.yaml / setting-local.yaml),
      IMAGER_CONFIG_DIR: /etc/imager/config

    networks:
      - default

volumes:
  imager_source:
  imager_result:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.172.100.0/24
