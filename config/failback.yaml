########################################
# Imager — слой FAILBACK (резервные/необязательные механизмы).
#
# not-found fallback (pixel/image/page/redirect), source-fallback.
# Меняется почти никогда.
#
# Файл ОПЦИОНАЛЕН. Переопределение: failback-local.yaml поверх этого файла.
########################################
# version: "1"

########################################
# http — только fallback-подсекции (остальной http — в setting.yaml).
########################################
http:
  # not-found-cache-control — Cache-Control для fallback-ответов (404 и т.п.).
  # Тип: string. Дефолт в коде: "no-store".
  # Пустое значение = заголовок не выставляется.
  # Значение описывает кэширование страниц ошибок/пикселя, поэтому по
  # умолчанию no-store. Явно задаём дефолт — поведение не меняется.
  not-found-cache-control: "no-store"

  # not-found — поведение при отсутствии запрашиваемого ассета (мимо кэша
  # и мимо source). Поля взаимоисключающие по приоритету:
  #   pixel > redirect > image > page.
  not-found:
    # pixel — отдавать прозрачный 1x1 пиксель в ЗАПРОШЕННОМ формате (через
    # PixelGenerator, метаданные соответствуют формату URL).
    # Тип: bool. Дефолт: false.
    # Если true и формат не поддерживается — выполняется следующий fallback.
    pixel: true

    # image — путь к СТАТИЧЕСКОМУ файлу-картинке, отдаваемому с HTTP 404.
    # Тип: string (путь к файлу). Дефолт: пусто.
    # Пример: "not-found.png"
    # image: "not-found.png"

    # page — путь к СТАТИЧЕСКОМУ HTML-файлу, отдаваемому с HTTP 404.
    # Тип: string (путь к файлу). Дефолт: пусто.
    # Раскомментируйте и укажите путь до HTML.
    # page: "not-found.html"

    # redirect — URL для 301-редиректа при not-found.
    # Тип: string (URL). Дефолт: пусто.
    # redirect: "https://example.com/404"

  # source-fallback — fallback на ИСХОДНЫЙ файл при ошибке ассета
  # (несуществующий пресет, неканонический URL, запрещённая политика).
  # Если включено и исходный файл существует, вместо пикселя/ошибки отдаётся
  # исходный файл с его оригинальными Content-Type/именем/форматом.
  # Выключено по умолчанию (текущее поведение).
  source-fallback:
    # enabled — включать ли канонический source fallback (URL вида
    # name-format.ext).
    # Тип: bool. Дефолт: false.
    enabled: false

    # status — HTTP-статус ответа при source fallback.
    # Тип: int. Дефолт: 404. Допустимо: 200 или 404.
    status: 404

    # cache-control — Cache-Control для source fallback-ответа.
    # Тип: string. Дефолт: "no-store".
    cache-control: "no-store"