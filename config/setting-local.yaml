########################################
# Локальная конфигурация (setting-local.yaml).
#
# Опциональный файл. Если присутствует в каталоге конфигурации — глубоко
# переопределяет базовый setting.yaml:
#   - вложенные map мержатся (ключи, не указанные в local, сохраняются);
#   - скаляры заменяются значением из local;
#   - списки заменяются ЦЕЛИКОМ (не дополняются).
#
# Отсутствие файла — нормальная ситуация. Файл НЕ должен содержать
# прикладных env-переменных — всё задаётся здесь.
#
# Этот файл по умолчанию НЕ закоммичивается в продакшн (см. .gitignore) и
# служит шаблоном/локальным примером. Скопируйте нужные ключи и подставьте
# свои значения.
#
# ВАЖНО: конфигурация декодируется строго (yaml.UnmarshalStrict) — любой
# ключ, отсутствующий в схеме (см. config/setting.yaml и README.md),
# считается ошибкой и валит старт. Используйте только актуальные имена
# ключей без префиксов (например dial-timeout, а не s3-dial-timeout).

########################################
# Локальные переопределения (активные).

# ImageMagick: абсолютный путь к бинарю (ОПЦИОНАЛЬНЫЙ fallback для сборок
# без тега "libvips"). В обычном сценарии (libvips работает) не используется.
# На Windows имя `magick` может не разрешаться через PATH (например, при
# запуске из IDE/службы), поэтому при необходимости укажите полный путь к
# magick.exe. Используйте прямые слэши.
# imagemagick:
#   binary: "D:/OSPanel/addons/ImageMagick-vs17/magick.exe"

# libvips: настройки основного процессора (in-process govips). Секция
# актуальна, если бинарь собран с -tags libvips (см. config/setting.yaml).
# Все поля optional — 0/пусто = умолчания.
libvips:
  limits:
    timeout: "30s"
    output-bytes: 10485760
    concurrency: 2
    threads: 0
    max-cache-mem: 52428800
    max-cache-files: 0
    max-cache-size: 100

########################################
# Примеры переопределений (раскомментируйте и адаптируйте):

# server:
#   addr: ":9090"
#
# source:
#   storage: "s3"
#   bucket: "my-images"
#   prefix: "source/"
#   region: "ru-central1"
#   endpoint: "https://storage.yandexcloud.net"
#   access-key: "REPLACE_ME"   # или env IMAGER_S3_ACCESS_KEY
#   secret-key: "REPLACE_ME"   # или env IMAGER_S3_SECRET_KEY
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#   max-idle-conns: 100
#   max-idle-conns-per-host: 10
#   idle-conn-timeout: "90s"
#   metadata-ttl: "30s"
#
# result:
#   storage: "s3"
#   bucket: "my-images"
#   prefix: "result/"
#   region: "ru-central1"
#   endpoint: "https://storage.yandexcloud.net"
#   access-key: "REPLACE_ME"   # или env IMAGER_S3_ACCESS_KEY
#   secret-key: "REPLACE_ME"   # или env IMAGER_S3_SECRET_KEY
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#   max-idle-conns: 100
#   max-idle-conns-per-host: 10
#   idle-conn-timeout: "90s"
#   metadata-ttl: "30s"
#
# # Пример SFTP source (host-key-fingerprint обязателен):
# source:
#   storage: "sftp"
#   addr: "sftp.example.com:22"
#   user: "imager"
#   private-key-file: "/etc/imager/id_ed25519"
#   root: "/srv/images"
#   host-key-fingerprint: "SHA256:AbCd..."
#   dial-timeout: "30s"
#
# # Пример HTTP source (только source; как result — ошибка старта):
# source:
#   storage: "http"
#   base-url: "https://cdn.example.com/images"
#   spool-max-bytes: 10485760
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#
# imagemagick:
#   limits:
#     timeout: "30s"
#     output-bytes: 10485760
#     concurrency: 2
#   policy:
#     disabled-coders:
#       - "PDF"
#
# # metadata: явный локальный корень sidecar-метаданных (metadata.dir),
# # независимый от хранилищ source/result. Удобно при remote-result
# # (S3/SFTP/FTP), чтобы указать известный локальный каталог.
# metadata:
#   dir: "./data/meta"
#
# observability:
#   log-level: "debug"
#
# # http.source-fallback — fallback на исходный файл при ошибке ассета
# # (несуществующий пресет, неканонический URL, запрещённая политика).
# # Выключен по умолчанию. status: 200 или 404 (дефолт 404).
# http:
#   source-fallback:
#     enabled: false
#     status: 404
#     cache-control: "no-store"
#
# # observability.asset-errors — учёт ошибок asset URL (счётчики, top-paths,
# # структурные логи). Включён по умолчанию.
# observability:
#   asset-errors:
#     enabled: true
#     log-level: warn
#     top-paths:
#       enabled: false
#       max-entries: 1024
#       report-top: 20
#       key-mode: source   # source | hash
#
# admin — административные эндпоинты (ВЫКЛЮЧЕНЫ по умолчанию).
# Позволяют управлять ассетами: фоновая генерация всех/выбранных ассетов
# исходника и удаление ассетов. Доступность и авторизация настраиваются
# здесь. При включении (enabled: true) ОБЯЗАТЕЛЕН непустой token — иначе
# старт завершится ошибкой (fail-fast).
#
# Маршруты (регистрируются только при enabled: true):
#   POST   /admin/assets/generate   — генерация ассетов
#   DELETE /admin/assets/delete     — удаление ассетов
#
# Авторизация: заголовок "Authorization: Bearer <token>".
# Неверный/отсутствующий токен → HTTP 403.
#
# ВАЖНО: секция закомментирована, чтобы не менять активное поведение
# (admin выключен). Раскомментируйте и задайте свой token при необходимости.
# admin:
#   # enabled — включать ли admin-эндпоинты. Тип: bool. Дефолт: false.
#   enabled: false
#
#   # token — bearer-токен для авторизации. Тип: string. Дефолт: "".
#   # Обязателен при enabled: true (иначе fail-fast ошибка старта).
#   token: "REPLACE_WITH_STRONG_SECRET"
#
#   # workers — число параллельных фоновых генераций. Тип: int. Дефолт: 2.
#   workers: 2
#
#   # queue-size — ёмкость очереди задач; переполнение → HTTP 503.
#   # Тип: int. Дефолт: 64.
#   queue-size: 64
#
#   # wait-timeout — таймаут режима wait=true (ожидания завершения всех
#   # ассетов до ответа). Тип: duration-строка. Дефолт: "300s".
#   wait-timeout: "300s"
