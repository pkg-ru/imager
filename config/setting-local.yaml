########################################
# Локальная конфигурация (setting-local.yaml).
#
# Опциональный файл. Если присутствует в каталоге конфигурации — глубоко
# переопределяет базовый setting.yaml:
#   - вложенные map мержатся (ключи, не указанные в local, сохраняются);
#   - скаляры заменяются значением из local;
#   - списки заменяются ЦЕЛИКОМ (не дополняются).
#
# Отсутствие файла — нормальная ситуация. Файл НЕ должен содержать
# прикладных env-переменных — всё задаётся здесь.
#
# Этот файл по умолчанию НЕ закоммичивается в продакшн (см. .gitignore) и
# служит шаблоном/локальным примером. Скопируйте нужные ключи и подставьте
# свои значения.
#
# ВАЖНО: конфигурация декодируется строго (yaml.UnmarshalStrict) — любой
# ключ, отсутствующий в схеме (см. config/setting.yaml и README.md),
# считается ошибкой и валит старт. Используйте только актуальные имена
# ключей без префиксов (например dial-timeout, а не s3-dial-timeout).

########################################
# Локальные переопределения (активные).

# ImageMagick: абсолютный путь к бинарю. На Windows имя `magick` может не
# разрешаться через PATH (например, при запуске из IDE/службы), поэтому
# указываем полный путь к magick.exe. Используйте прямые слэши.
imagemagick:
  binary: "D:/OSPanel/addons/ImageMagick-vs17/magick.exe"

########################################
# Примеры переопределений (раскомментируйте и адаптируйте):

# server:
#   addr: ":9090"
#
# source:
#   storage: "s3"
#   bucket: "my-images"
#   prefix: "source/"
#   region: "ru-central1"
#   endpoint: "https://storage.yandexcloud.net"
#   access-key: "REPLACE_ME"   # или env IMAGER_S3_ACCESS_KEY
#   secret-key: "REPLACE_ME"   # или env IMAGER_S3_SECRET_KEY
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#   max-idle-conns: 100
#   max-idle-conns-per-host: 10
#   idle-conn-timeout: "90s"
#   metadata-ttl: "30s"
#
# result:
#   storage: "s3"
#   bucket: "my-images"
#   prefix: "result/"
#   region: "ru-central1"
#   endpoint: "https://storage.yandexcloud.net"
#   access-key: "REPLACE_ME"   # или env IMAGER_S3_ACCESS_KEY
#   secret-key: "REPLACE_ME"   # или env IMAGER_S3_SECRET_KEY
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#   max-idle-conns: 100
#   max-idle-conns-per-host: 10
#   idle-conn-timeout: "90s"
#   metadata-ttl: "30s"
#
# # Пример SFTP source (host-key-fingerprint обязателен):
# source:
#   storage: "sftp"
#   addr: "sftp.example.com:22"
#   user: "imager"
#   private-key-file: "/etc/imager/id_ed25519"
#   root: "/srv/images"
#   host-key-fingerprint: "SHA256:AbCd..."
#   dial-timeout: "30s"
#
# # Пример HTTP source (только source; как result — ошибка старта):
# source:
#   storage: "http"
#   base-url: "https://cdn.example.com/images"
#   spool-max-bytes: 10485760
#   dial-timeout: "30s"
#   read-timeout: "60s"
#   max-attempts: 3
#
# imagemagick:
#   limits:
#     timeout: "30s"
#     output-bytes: 10485760
#     concurrency: 2
#   policy:
#     disabled-coders:
#       - "PDF"
#
# observability:
#   log-level: "debug"
