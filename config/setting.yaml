########################################
# Imager — слой SETTING (фундамент).
#
# Инфраструктура сервера: HTTP-порт/таймауты, пути хранения, стораджи,
# observability/logging, безопасность, admin. Меняется редко.
#
# Каталог конфигурации задаётся env IMAGER_CONFIG_DIR. В нём могут лежать:
#   setting.yaml + setting-local.yaml   — этот слой (обязателен setting.yaml)
#   generate.yaml + generate-local.yaml — слой генерации ассетов (опционально)
#   failback.yaml + failback-local.yaml — слой fallback-механизмов (опционально)
#
# Механизм загрузки (adapters/httpapi/configloader.go):
#   1. Для каждой пары: base <- local глубоким merge (map'ы рекурсивно,
#      скаляры заменяются, СПИСКИ заменяются ЦЕЛИКОМ).
#   2. Слои объединяются: setting -> generate -> failback.
#   3. Результат строго декодируется (yaml.UnmarshalStrict): любой ключ вне
#      схемы — ошибка старта.
#
# Важно: добавляйте только ключи из документации ниже. «Примеры» других
# хранилищ и опций в этом файле закомментированы, чтобы не менять активное
# поведение — раскомментируйте по необходимости.
#
# Версия схемы — "1". Другое значение — ошибка старта
# (config: unsupported version). Ключ version задаётся ТОЛЬКО здесь.
########################################

version: "1"

########################################
# server — HTTP/TCP сервер (внутренние настройки прослушивания).
#
# Настраивает адрес, таймауты и лимиты входящего HTTP-запроса.
# Если указать таймаут пустым (убрать ключ) — применится дефолт runtime.
# Тип значений таймаутов — строковый duration (parse duration Go):
#   "5s", "1m30s", "250ms" и т.п. Отрицательные значения запрещены.
# Параметры max-* — целые числа (байты).
########################################
server:
  # addr — адрес прослушивания TCP (host:port).
  # Тип: string. Дефолт в коде: ":8080".
  # Пусто = слушать все интерфейсы на порту 8080.
  addr: ":8080"

  # read-header-timeout — таймаут чтения заголовков запроса.
  # Тип: duration-строка. Дефолт в коде: "5s".
  # Защита от медленных/незавершённых клиентов (slowloris).
  read-header-timeout: "5s"

  # read-timeout — таймаут чтения ТЕЛА запроса.
  # Тип: duration-строка. Дефолт в коде: "15s".
  # Сервис тело не принимает, но лимит ограничивает время чтения соединения.
  read-timeout: "15s"

  # write-timeout — таймаут записи ОТВЕТА клиенту.
  # Тип: duration-строка. Дефолт в коде: "30s".
  # В production поднят до 120s, чтобы большие медиа-ответы (крупные
  # изображения, анимации) успевали дотянуться до медленных клиентов.
  write-timeout: "120s"

  # idle-timeout — таймаут простаивания keep-alive соединения.
  # Тип: duration-строка. Дефолт в коде: "60s".
  # После бездействия дольше этого срока соединение закрывается.
  idle-timeout: "60s"

  # shutdown-timeout — максимальное время ожидания активных запросов при
  # graceful shutdown (SIGINT/SIGTERM).
  # Тип: duration-строка. Дефолт в коде: "15s".
  # По истечении — принудительное закрытие соединений и завершение.
  shutdown-timeout: "30s"

  # max-header-bytes — максимальный суммарный размер заголовков запроса.
  # Тип: int (байты). Дефолт в коде: 32768 (32 KiB, уменьшено с 1 MiB).
  # Превышение → HTTP 431 Request Header Fields Too Large.
  max-header-bytes: 32768

  # max-body-bytes — жёсткий лимит размера ТЕЛА запроса.
  # Тип: int (байты). Дефолт в коде: 4096 (4 KiB).
  # 0 = без лимита. Сервис НЕ принимает тела запросов, поэтому по умолчанию
  # жёсткий небольшой лимит — защита от slow-body и DoS через раздутие тела.
  max-body-bytes: 4096

########################################
# http — HTTP-адаптер: CORS, кэширующие/security-заголовки, лимит длины URL,
# таймаут генерации ассета, admission control.
# not-found / source-fallback / not-found-cache-control переехали в failback.yaml.
########################################
http:
  # allowed-origins — CORS allowlist (deny-by-default).
  # Тип: list[string]. Дефолт: пусто (ни один origin не разрешён).
  # Каждый элемент — схема+хост: "https://cdn.example.com". "http://..." —
  # тоже допустимо, но не рекомендуется. Пустой список = никакие cross-origin
  # запросы не получают CORS-заголовков.
  # ВАЖНО: комбинация wildcard "*" + allow-credentials: true ЗАПРЕЩЕНА
  # (ошибка валидации на старте) — несовместимо со спецификацией CORS.
  # Примеры (раскомментируйте при необходимости):
  # allowed-origins:
  #   - "https://cdn.example.com"
  #   - "https://images.example.net"

  # allow-credentials — разрешать ли Access-Control-Allow-Credentials.
  # Тип: bool. Дефолт: false.
  # true = разрешить отправку cookies/авторизационных заголовков при CORS.
  # Не совместим с wildcard "*" в allowed-origins.
  allow-credentials: false

  # cache-control — значение заголовка Cache-Control для УСПЕШНО
  # сгенерированных канонических ассетов (эти ассеты immutable).
  # Тип: string. Дефолт в коде: "public, max-age=31536000, immutable" (1 год).
  # Пустое значение = заголовок не выставляется вовсе.
  # В production переопределён на 1 месяц (2592000 сек) — месячная палитра
  # для CDN/браузеров.
  cache-control: "public, max-age=2592000" # месяц

  # referrer-policy — значение заголовка Referrer-Policy.
  # Тип: string. Дефолт в коде: "no-referrer".
  # no-referrer = браузер не отправляет заголовок Referer вообще (privacy).
  referrer-policy: "no-referrer"

  # csp — значение Content-Security-Policy (выставляется для fallback-страниц).
  # Тип: string. Дефолт: пусто (заголовок не выставляется).
  # Например: "default-src 'none'; img-src 'self'".
  # Актуально, если failback http.not-found.page используется для HTML-страницы.
  # csp: "default-src 'none'"

  # max-url-len — максимальная длина asset URL.
  # Тип: int (символов). Дефолт в коде: 1024 (0 → 1024, asset.MaxURLLen).
  # Превышение → HTTP 414 URI Too Long.
  max-url-len: 1024

  # generate-timeout — таймаут генерации ассета (context deadline для
  # вызова Generate).
  # Тип: duration-строка. Дефолт в коде: "30s".
  # Превышение → HTTP 504 Gateway Timeout (плюс отмена процессора).
  generate-timeout: "30s"

  # max-concurrent-requests — максимальное число ОДНОВРЕМЕННО обрабатываемых
  # asset-запросов (admission control).
  # Тип: int. Дефолт в коде: 0 (без ограничения).
  # При превышении лимита возвращается HTTP 503 + Retry-After: 1, запрос НЕ
  # уходит в процессоры/сеть. Применяется только к asset-запросам ("/"),
  # health/metrics остаются доступными при перегрузке.
  # 0 = без ограничения.
  max-concurrent-requests: 4

########################################
# source / result — хранилища исходников и результатов.
#
# Поддерживаемые типы (storage):
#   fs    — локальная файловая система (по умолчанию);
#   s3    — S3 и S3-совместимые (MinIO, Yandex Object Storage...);
#   sftp  — SSH File Transfer Protocol;
#   ftp   — plain FTP;
#   ftps  — FTP over TLS (explicit); tls: true + tls-verify (false ЗАПРЕЩЁН);
#   http  — HTTP/HTTPS (ТОЛЬКО для source; use as result — ошибка старта).
#
# Общая схема одной секции (применяется для source и result):
#   storage: <fs|s3|sftp|ftp|ftps|http>
#   path:    локальный каталог при storage: fs
#   + для s3: bucket (обязателен), prefix, endpoint, region,
#             access-key / secret-key (только парой; или env
#             IMAGER_S3_ACCESS_KEY / IMAGER_S3_SECRET_KEY);
#   + для sftp: addr, user, password|private-key-file, root,
#             host-key-fingerprint (ОБЯЗАТЕЛЬНО, "SHA256:..." );
#   + для ftp/ftps: addr, user, password, root, tls, tls-verify;
#   + для http: base-url (обязательный);
#   + для remote всех типов — параметры соединения ниже.
#
# Параметры соединения для remote (s3/sftp/ftp/ftps/http):
#   spool-dir            каталог для временных spool-файлов (пусто = системный tmp);
#   spool-max-bytes      максимум для spool ключа (0 = без лимита);
#   dial-timeout         таймаут установления соединения (дефолт "30s");
#   read-timeout         таймаут выполнения операции для S3/HTTP/SFTP/FTP
#                        (дефолт "60s" для S3/HTTP);
#   max-attempts         число попыток операции (дефолт 3);
#   max-idle-conns       макс. idle-соединений в пуле (дефолт 100);
#   max-idle-conns-per-host макс. idle-соединений на хост (S3/HTTP; дефолт 10);
#   idle-conn-timeout    время жизни idle-соединения (дефолт "90s");
#   metadata-ttl         TTL кэша метаданных S3 (дефолт "30s"; 0 = кэш отключён).
#
# Ограничения валидации:
#   - s3   без bucket или с только одним из access/secret — ошибка;
#   - sftp требует addr + user + host-key-fingerprint;
#   - ftp/ftps требует addr; ftps tls-verify=false ЗАПРЕЩЁН;
#   - http требует base-url и доступен ТОЛЬКО как source.
########################################
source:
  storage: fs
  path: "/data/source" # каталог исходных файлов на диске (для fs)

  # ---------- Примеры альтернативных source (закомментировано; включите
  # необходимое, заменив storage и раскомментировав подходящий блок) --------
  #
  # Пример S3 source:
  # storage: s3
  # bucket: "my-images-source"        # обязательно
  # prefix: "source/"                 # завершающий "/" нормализуется
  # endpoint: "https://storage.yandexcloud.net"   # пусто = AWS
  # region: "ru-central1"
  # access-key: "AKIA..."             # или env IMAGER_S3_ACCESS_KEY
  # secret-key: "..."                 # или env IMAGER_S3_SECRET_KEY
  # spool-dir: "./spool-src"
  # dial-timeout: "30s"
  # read-timeout: "60s"
  # max-attempts: 3
  # max-idle-conns: 100
  # max-idle-conns-per-host: 10
  # idle-conn-timeout: "90s"
  # metadata-ttl: "30s"
  #
  # Пример SFTP source:
  # storage: sftp
  # addr: "sftp.example.com:22"       # обязательно
  # user: "imager"                     # обязательно
  # password: "..."                    # либо private-key-file ниже
  # private-key-file: "/etc/imager/id_ed25519"
  # root: "/srv/images"               # корневой каталог на сервере
  # host-key-fingerprint: "SHA256:AbCd..."   # ОБЯЗАТЕЛЬНО (безопасность)
  # dial-timeout: "30s"
  # read-timeout: "60s"
  #
  # Пример FTPS source:
  # storage: ftps
  # addr: "ftps.example.com:21"       # обязательно
  # user: "imager"
  # password: "..."
  # root: "/srv/images"
  # tls: true                          # FTPS (explicit TLS)
  # tls-verify: true                   # false запрещён для ftps
  # dial-timeout: "30s"
  #
  # Пример HTTP source (только source!):
  # storage: http
  # base-url: "https://cdn.example.com/images"   # обязательно
  # dial-timeout: "30s"
  # read-timeout: "60s"
  # max-attempts: 3
  # max-idle-conns: 100
  # max-idle-conns-per-host: 10
  # idle-conn-timeout: "90s"
  # --------------------------------------------------------------------------

result:
  storage: fs
  path: "/data/result" # каталог результатов на диске (для fs)

  # Для result ДОСТУПНЫ те же remote-хранилища, кроме http (запрещено).
  # Пути к исходным и результатам могут отличаться (разные хранилища для
  # чтения и записи). Пример S3 result:
  # storage: s3
  # bucket: "my-result-bucket"
  # prefix: "gen"
  # ...

########################################
# libvips — настройки основного процессора libvips (govips, in-process).
#
# libvips — основной движок обработки изображений. Компилируется в бинарь
# (cgo, govips) и работает in-process, без subprocess. Сборка с поддержкой
# libvips: go build -tags libvips (требуются libvips-dev и компилятор C).
# Если бинарь собран БЕЗ тега libvips — процессор недоступен, и сервис
# использует ImageMagick как primary.
#
# В слое SETTING — только РЕСУРСНАЯ инфраструктура движка (одна на процесс):
#   limits, operation-cache, metrics-interval.
# Параметры ГЕНЕРАЦИИ (encoders / shrink-on-load / watermark-cache /
# detection-семафор / color) — в generate.yaml.
#
# Лимиты применяются двумя слоями:
#   1) глобальная конфигурация libvips (threads, max-cache-mem/files/size) —
#      задаётся ОДИН раз на процесс при Startup;
#   2) application-level ограничения: bounded writer (output-bytes) на выход
#      и context deadline (timeout) на каждый запрос обработки.
########################################
libvips:
  # limits — resource limits обработчика libvips.
  limits:
    # timeout — application-level context deadline на одну операцию обработки.
    # Тип: duration-строка (например "30s"). Превышение → LimitError
    # (в HTTP — таймаут обработки).
    timeout: "30s"

    # output-bytes — application-level лимит размера ВЫХОДНЫХ данных (байт).
    # Реализуется boundedWriter'ом; при превышении запись прекращается
    # (LimitError). Защита от гигантских результатов.
    output-bytes: 10485760 # 10 MiB

    # concurrency — максимальное число ОДНОВРЕМЕННО выполняемых операций
    # обработки libvips (bounded очередь слотов; 0 = код применяет 16).
    # Реальная защита памяти/CPU при параллельных запросах (например 2-4).
    concurrency: 2

    # threads — число потоков libvips (vips_concurrency_set). 0 = default
    # govips (1). Для нагруженного процесса рекомендуется число логических
    # ядер (иначе libvips сам распараллелит по ядрам поверх concurrency).
    threads: 4

    # max-cache-mem — максимум памяти кэша libvips (байт). 0 = default
    # govips (50 MiB). Уменьшение снижает пиковое потребление памяти.
    max-cache-mem: 52428800 # 50 MiB

    # max-cache-files — максимум открытых файлов кэша libvips. 0 = default.
    max-cache-files: 0

    # max-cache-size — максимум операций в кэше libvips. 0 = default (100).
    max-cache-size: 100

  # operation-cache — operation cache libvips (Фаза 5b). libvips кэширует
  # результаты операций (vips_cache): кэш полезен для повторяющихся операций
  # на одних и тех же изображениях, но для stateless-обработчика он бесполезен,
  # ест память и несёт риск на musl/Alpine. Рекомендация для продакшена: false.
  # При отключении в Startup передаются НУЛЕВЫЕ лимиты кэша
  # (vips_cache_set_max_mem(0) / vips_cache_set_max(0) / set_max_files(0)) —
  # в govips 0 означает ПОЛНОЕ ОТКЛЮЧЕНИЕ кэша (не "без лимита").
  # Дефолт: true (обратная совместимость).
  operation-cache:
    enabled: true

  # metrics-interval — интервал периодического сбора vips-метрик
  # (observability): tracked memory/allocs, open files, число операций,
  # метрики кэша ватермарок. Экспортируются через /metrics как gauge-и
  # imager_vips_*. Минимум: "1s".
  # Тип: duration-строка. Дефолт в коде: "15s".
  metrics-interval: "15s"

  # encoders — per-format параметры сжатия кодировщиков libvips.
  encoders:
    # webp-reduction-effort — reduction effort WebP [0..6]: больше = лучше
    # сжатие, медленнее. Дефолт: 4.
    webp-reduction-effort: 4

    # avif-speed — speed/effort AVIF [0..9]: больше = быстрее, хуже сжатие.
    # 0 = умолчание govips (5). Рекомендуется 6 как баланс.
    avif-speed: 6

    # png-compression-level — уровень сжатия PNG [0..9] (применяется и к
    # APNG): больше = меньше размер, медленнее. Дефолт: 6.
    png-compression-level: 6

    # jxl-effort — effort JPEG XL [0..9]: больше = лучше сжатие, медленнее.
    # 0 = умолчание govips (7).
    jxl-effort: 0

    # jpeg-progressive — прогрессивный (interlaced) JPEG: true = progressive,
    # false = baseline (обычный). Дефолт: false.
    jpeg-progressive: false

    # png-interlace — чересстрочный (interlaced/Adam7) PNG: true = interlace,
    # false = обычный. Дефолт: false.
    png-interlace: false

    # png-palette — PNG-квантование (палитровый экспорт) для статичных PNG.
    # По умолчанию ВЫКЛЮЧЕНО: применяется ТОЛЬКО при явном включении, чтобы
    # не вносить артефакты в градиенты (градиенты дешёво не определить —
    # решение простое: опция управляется конфигом). При ошибке квантования
    # происходит автоматический fallback на обычный PNG (запрос не падает).
    # К APNG не применяется (палитра несовместима с чанками анимации).
    png-palette: false

    # png-palette-colors — максимальное число цветов палитры [2..256].
    # Значимо при png-palette=true. 0 = дефолт 256 (максимум палитры PNG).
    png-palette-colors: 0

    # png-palette-bit-depth — битность палитры [1..8] при png-palette=true.
    # Позволяет сохранить (воспроизвести) палитровую битность исходника
    # (например 4-битную палитру). 0 = дефолт 8.
    png-palette-bit-depth: 0

    # gif-bit-depth — битность палитры GIF [1..8] (меньше = компактнее,
    # до 256 цветов). 0 = умолчание govips (8).
    gif-bit-depth: 0

  # shrink-on-load — предварительное уменьшение при декодировании
  # JPEG/WebP/GIF/HEIF/AVIF. Коэффициент вычисляется из целевого размера
  # плана с запасом ×2 (после shrink размер >= цели; точный resize всё равно
  # выполняется далее). Консервативно: НЕ применяется при trim/smart-crop/
  # face-crop/object-crop, ручной ориентации или ненейтральном EXIF-повороте,
  # size=x, неизвестных размерах и для анимированных GIF.
  shrink-on-load:
    # enabled — включить оптимизацию. Дефолт: true.
    enabled: true

  # watermark-cache — in-memory кэш ФАЙЛОВ ватермарок. Кэшируются исходные
  # БАЙТЫ файла, keyed по пути файла (не по конфигурации наложения): один
  # файл обслуживает сотни разных настроек позиции/масштаба/repeat.
  # Декодирование выполняется libvips на каждый запрос (быстро благодаря
  # operation cache), чтение с диска устраняется. Инвалидация — по
  # mtime/размеру файла (stat на каждый запрос) плюс TTL; вытеснение — LRU
  # по числу файлов И суммарному бюджету байтов; параллельная загрузка
  # одного файла дедуплицируется (singleflight). При промахе кэша —
  # прозрачное чтение с диска, запрос не ломается.
  watermark-cache:
    # enabled — включить кэш. false = каждое использование читает диск.
    # Дефолт: true.
    enabled: true

    # max-files — максимум записей (файлов) в кэше. 0 = дефолт (32).
    max-files: 32

    # max-bytes — суммарный бюджет памяти кэша в байтах. Файл больше бюджета
    # не кэшируется (обслуживается напрямую). 0 = дефолт (67108864 = 64 MiB).
    max-bytes: 67108864

    # ttl — максимальное время жизни записи (duration-строка). Основная
    # инвалидация — по mtime/размеру; TTL — страховочная. 0 = дефолт ("5m").
    ttl: "5m"

  # detection — настройки detection-семафора (Фаза 4): тяжёлые CPU-bound
  # ONNX-инференсы (face-crop/object-crop) выполняются ВНЕ libvips-слотов
  # в отдельном bounded-семафоре. Схема handoff: на время инференса
  # libvips-слот освобождается и берётся detection-слот, после инференса
  # слоты меняются обратно. Это защищает лёгкие операции (decode/resize/
  # encode) от голодания при потоке fc/oc-запросов, сохраняя ограничение
  # суммарной конкурентности (защита от OOM).
  detection:
    # concurrency — максимум одновременных ONNX-инференсов.
    # Тип: int. Дефолт в коде: max(1, GOMAXPROCS/2).
    # Инференс полностью нагружает ядро CPU; половина ядер оставляет
    # пропускную способность лёгким операциям и HTTP-слою.
    concurrency: 0

    # max-wait — бюджет ожидания detection-слота (duration-строка).
    # По истечении запрос получает быстрый отказ перегрузки (503), а не
    # копит хвост задержки. Отрицательные значения запрещены.
    # Тип: duration-строка. Дефолт в коде: "5s".
    max-wait: "5s"

  # color — политика ICC color management (Фаза 5a). Управляет обработкой
  # embedded-ICC-профиля исходника (CMYK/ProPhoto/Display-P3 и т.п.):
  #   - strip (дефолт): профиль удаляется при обработке (текущее поведение,
  #     обратная совместимость);
  #   - transform: embedded-профиль конвертируется в стандартный sRGB через
  #     PCS ПЕРЕД пиксельной обработкой. Fast-path: sRGB-совместимые профили
  #     и изображения уже в sRGB без профиля не конвертируются (нулевой
  #     оверхед). Битый/отсутствующий профиль или ошибка lcms не роняют
  #     запрос — fallback на strip с warning-логом;
  #   - keep: embedded-профиль сохраняется в выходном изображении.
  # Тип: string. Дефолт: "strip".
  color:
    mode: strip

########################################
# processing — общие параметры обработки изображений.
########################################
processing:
  # default-quality — качество сжатия ПО УМОЛЧАНИЮ (используется, когда в
  # пресете или запросе quality не задано или = 0).
  # Тип: int 0-100. Вне диапазона [0,100] — ошибка валидации на старте.
  # Применяется к lossy-форматам (jpeg/webp). На PNG влияет не quality,
  # а png-compression-level (см. imagemagick.limits / libvips.encoders).
  default-quality: 85

  # default-loop — зацикливание анимаций ПО УМОЛЧАНИЮ.
  # Тип: *bool (true/false). Не задан (nil) => по умолчанию true (зациклено).
  # Применяется к GIF/WebP/APNG/HEIF анимациям, если в пресете не задан loop.
  # Пример: развернуть как значение, чтобы изменить поведение:
  # default-loop: false

  # default-watermark — ватермарка ПО УМОЛЧАНИЮ (имя из секции watermarks).
  # Тип: string. Дефолт: пусто (= не применяется). Применяется к запросам,
  # где ватермарка не задана ни в пресете, ни в path-policy. Неизвестное
  # имя — ошибка старта.
  # Пример:
  # default-watermark: water-test

  # default-auto-orient — автоматический поворот по EXIF Orientation
  # ПО УМОЛЧАНИЮ.
  # Тип: *bool. Дефолт: true.
  # true = при загрузке изображение автоматически поворачивается согласно
  # тегу EXIF Orientation (фото с телефонов/камер отображаются правильно).
  # false = EXIF Orientation игнорируется (изображение обрабатывается как
  # сохранено). Пресеты могут перекрыть значение полем auto-orient.
  # Пример:
  # default-auto-orient: true

  # default-rotate — фиксированный поворот ПО УМОЛЧАНИЮ (по часовой стрелке).
  # Тип: string. Дефолт: "" (без поворота).
  # Допустимые значения: "" (не задано), "none" (без поворота), "90", "180",
  # "270". Применяется ПОСЛЕ auto-orient и ДО resize/crop/trim. Пресеты могут
  # перекрыть значение полем rotate.
  # Пример:
  # default-rotate: "90"

  # default-flip — отражение ПО УМОЛЧАНИЮ.
  # Тип: string. Дефолт: "" (без отражения).
  # Допустимые значения: "" (не задано), "none" (без отражения),
  # "horizontal" (зеркало слева-направо), "vertical" (отражение сверху-вниз).
  # Применяется ПОСЛЕ rotate и ДО resize/crop/trim. Пресеты могут перекрыть
  # значение полем flip.
  # Пример:
  # default-flip: horizontal

  # default-trim-mode — режим определения цвета однотонного поля для
  # независимого фильтра trim (обрезка однотонных полей).
  # Тип: string. Дефолт: "auto".
  #   "auto"  — автоматическое определение цвета фона (по краевому пикселю);
  #   "color" — фиксированный цвет фона (default-trim-color).
  # Применяется к trim-запросам (t/ct/sct/fct/oct), если в пресете trim не
  # задан. Настройки trim — глобальные (не per-preset).
  default-trim-mode: "auto"

  # default-trim-color — фиксированный цвет фона для trim в hex-форме
  # "#RRGGBB" (только при default-trim-mode: color).
  # Тип: string. Дефолт: "" (не задан).
  # Пример:
  # default-trim-color: "#ffffff"

  # default-trim-tolerance — допуск сравнения пикселей с фоновым цветом
  # для trim в диапазоне [0,1]: 0 — точное совпадение, 1 — любые пиксели
  # считаются фоном.
  # Тип: float. Дефолт: 0.
  default-trim-tolerance: 0

  # default-video-frame-percent — процент от длительности видео, на котором
  # выбирается кадр для превью (0-100).
  # Тип: int 0-100. Вне диапазона [0,100] — ошибка валидации на старте.
  # 0 = кадр берётся с начала видео.
  default-video-frame-percent: 50

  # default-video-min-contrast — минимальная контрастность кадра (0-1).
  # Если кадр менее контрастный, он считается неудачным и пропускается.
  # Тип: float 0-1. Вне диапазона [0,1] — ошибка валидации на старте.
  # 0 = проверка контрастности отключена (любой кадр считается удачным).
  default-video-min-contrast: 0.05

  # default-video-frame-step — на сколько кадров идти вперёд при неудачной
  # проверке контрастности (поиск следующего кандидата для превью).
  # Тип: int, должен быть >= 1. Значение < 1 — ошибка валидации на старте.
  default-video-frame-step: 1

  # default-video-attempts — сколько всего попыток сделать при поиске
  # подходящего кадра (с шагом default-video-frame-step).
  # Тип: int, должен быть >= 1. Значение < 1 — ошибка валидации на старте.
  default-video-attempts: 3

########################################
# detection — детектор лиц/объектов для операций face-crop ("fc") и
# object-crop ("oc").
#
# Детекция выполняется onnx-моделями (ONNX Runtime) внутри процесса libvips:
#   - face-model:  YuNet; находит лица;
#   - object-model: SSD/YOLO-подобная; находит объекты.
# Бинарь должен быть собран с тегом "-tags onnx" и иметь C-библиотеку
# ONNX Runtime (libonnxruntime). Без этого тега детектор НЕ работает:
# запросы с fc/oc вернут понятную ошибку.
#
# Включение/выключение задаётся ПУТЁМ К МОДЕЛИ: пустой путь = операция
# отключена (флага enabled НЕТ). Чтобы использовать только face-crop,
# укажите face-model и оставьте object-model пустой, и наоборот.
#
# Модели загружаются ЛЕНИВО (при первом запросе с соответствующей операцией)
# и кэшируются в памяти до завершения процесса. Если файл модели отсутствует
# на диске — ошибка при первом обращении (не при старте), чтобы сервис
# продолжал работать без ONNX-инфраструктуры.
########################################
detection:
  # face-model — путь к ONNX-модели YuNet для детекции лиц ("fc").
  # Тип: string. Пусто = face-crop отключён.
  # В Docker модели монтируются/копируются в /etc/imager/models/.
  face-model: "/etc/imager/models/face_detection_yunet_2023mar.onnx"

  # object-model — путь к ONNX-модели (SSD/YOLO-подобной) для детекции
  # объектов ("oc"). Тип: string. Пусто = object-crop отключён.
  object-model: "/etc/imager/models/ssd_mobilenet_v1_12.onnx"

  # onnx-runtime-lib — путь к библиотеке ONNX Runtime (libonnxruntime),
  # загружаемой через dlopen (Linux/macOS) или LoadLibrary (Windows).
  # Тип: string. Пусто = КРОССПЛАТФОРМЕННАЯ автодетекция по стандартным
  # путям (см. ort_library.go): Linux — libonnxruntime.so*/onnxruntime.so в
  # /usr/lib, /usr/local/lib, /opt/onnxruntime/lib; Windows — onnxruntime.dll
  # (рядом с exe, %WINDIR%\System32, %ProgramFiles%\onnxruntime\lib);
  # macOS — libonnxruntime*.dylib в /usr/local/lib, /opt/homebrew/lib,
  # /opt/onnxruntime/lib.
  # ВАЖНО: настройка задаётся ТОЛЬКО через конфиг-файл. Env-переменная
  # ONNXRUNTIME_SHARED_LIBRARY_PATH НЕ используется (соглашение проекта:
  # все настройки — через конфиг).
  onnx-runtime-lib: "/usr/lib/libonnxruntime.so.1.29.0"

  # confidence-threshold — порог уверенности детектора в интервале [0,1].
  # Боксы с уверенностью ниже порога отбрасываются (до NMS).
  # Тип: float. Дефолт: 0.5.
  confidence-threshold: 0.5

  # max-objects — максимальное число объектов, сохраняемых после NMS
  # (первые N самых уверенных).
  # Тип: int, должен быть > 0. Дефолт: 5.
  max-objects: 5

  # margin — отступ к найденной области как доля от её размера (0-1).
  # Применяется равномерно по обеим осям (половина с каждой стороны).
  # 0 = кроп строго по bounding box. Дефолт: 0.1 (10%).
  margin: 0.1

########################################
# application.output-limit — лимит размера сгенерированного выхода.
########################################
application:
  # output-limit — максимальный размер ВЫХОДНОГО файла, который будет
  # сохранён (0 = без лимита).
  # Тип: int64 (байт). Дефолт: 0 (= нет). При превышении — генерация
  # прерывается; результат не сохраняется.
  # Рекомендуется задавать явно, например 10485760 (10 MiB).
  output-limit: 10485760 # 10 MiB

  # buffer-max-bytes — общий бюджет памяти для спиллабл-буфера (source и
  # result вместе). При исчерпании — спул на диск (временный файл) даже
  # для in-memory данных. 0 = без лимита (не рекомендуется).
  # Тип: int64 (байты). Дефолт в коде: 524288000 (500 MiB).
  buffer-max-bytes: 524288000 # 500 MiB

########################################
# metadata — sidecar-кэш результатов ИИ-моделей и largest_ai_asset.
#
# Кэширует результаты детекции лиц/объектов (faces/objects) и крупнейший
# ИИ-ассет (largest_ai_asset) в локальном sidecar-файле родителя, чтобы
# каждая ИИ-модель вызывалась ровно ОДИН раз на родительский файл.
#
# Расположение метаданных настраивается ОТДЕЛЬНЫМ ключом metadata.dir —
# явный ЛОКАЛЬНЫЙ путь файловой системы, НЕЗАВИСИМЫЙ от того, какие
# хранилища используются для source/result (fs/S3/SFTP/FTP/HTTP).
# Метаданные ВСЕГДА хранятся локально по этому пути.
# Пустой dir = значение по умолчанию: <локальный result-каталог>
# (например ./data/result; без подкаталога .meta).
########################################
metadata:
  # enabled — включить sidecar-кэш моделей и largest_ai_asset.
  # Тип: bool. Дефолт: true. false = кэш моделей отключён, детекция
  # выполняется в процессоре.
  enabled: true

  # dir — корень sidecar-хранилища метаданных (metadata.dir).
  # Тип: string (локальный путь файловой системы). Дефолт:
  # <локальный result-каталог> (например ./data/result; без подкаталога .meta).
  # Если задан — используется СТРОГО он (никакой деривации от result).
  # Рекомендуется задавать, когда result хранится в remote (S3/SFTP/FTP),
  # чтобы метаданные лежали в известном локальном каталоге для бэкапа/очистки.
  # ВАЖНО для пакетных удалений: если для результата используется S3-хранилище,
  # metadata.dir лучше указывать ЛОКАЛЬНО (на локальном диске), а не в S3.
  # Тогда пакетное удаление ассетов в S3 не затрагивает sidecar-метаданные
  # (они остаются на локальном диске и не удаляются вместе с объектами S3).
  # Пример:
  # dir: "./data/meta"

########################################
# observability — логирование и метрики.
########################################
observability:
  # log-level — уровень логирования.
  # Тип: string. Дефолт: "info".
  # Допустимое: "debug", "info", "warn", "error" (регистронезависимо,
  # маппится в slog levels). В production рекомендуется "info"/"warn";
  # "debug" максимально подробен (для отладки).
  log-level: "info"

  # asset-errors — observability ошибок asset URL (несуществующий пресет,
  # неканонический URL, запрещённая политика, недопустимый план).
  # Включает: счётчики (imager_asset_errors), bounded top-paths и
  # структурные логи.
  asset-errors:
    # enabled — включать ли учёт ошибок asset URL.
    # Тип: bool. Дефолт: true.
    enabled: true

    # log-level — уровень структурного лога ошибки asset URL.
    # Тип: string. Дефолт: "warn". Допустимо: debug|info|warn|error.
    log-level: "warn"

    # top-paths — bounded реестр проблемных путей (LRU, вытеснение).
    # Тип: секция. Дефолт: выключен.
    top-paths:
      # enabled — включать ли учёт top-paths. Тип: bool. Дефолт: false.
      enabled: true
      # max-entries — максимальное число отслеживаемых путей (LRU).
      # Тип: int. Дефолт: 1024.
      max-entries: 1024
      # report-top — число путей в отчёте (Top(n)). Тип: int. Дефолт: 20.
      report-top: 20
      # key-mode — режим ключа: "source" (путь исходника) или "hash"
      # (sha256 первые 16 байт hex). Тип: string. Дефолт: "source".
      key-mode: "source"

########################################
# admin — административные эндпоинты (ВЫКЛЮЧЕНЫ по умолчанию).
#
# Позволяют управлять ассетами: фоновая генерация всех/выбранных ассетов
# исходника и удаление ассетов. Доступность и авторизация настраиваются
# здесь. При включении (enabled: true) ОБЯЗАТЕЛЕН непустой token — иначе
# старт завершится ошибкой (fail-fast).
#
# Маршруты (регистрируются только при enabled: true):
#   POST   /admin/assets/generate   — генерация ассетов
#   DELETE /admin/assets/delete     — удаление ассетов
#
# Авторизация: заголовок "Authorization: Bearer <token>".
# Неверный/отсутствующий токен → HTTP 403.
#
# ВАЖНО: секция закомментирована, чтобы не менять активное поведение
# (admin выключен). Раскомментируйте и задайте свой token при необходимости.
# admin:
#   # enabled — включать ли admin-эндпоинты. Тип: bool. Дефолт: false.
#   enabled: false
#
#   # token — bearer-токен для авторизации. Тип: string. Дефолт: "".
#   # Обязателен при enabled: true (иначе fail-fast ошибка старта).
#   token: "REPLACE_WITH_STRONG_SECRET"
#
#   # workers — число параллельных фоновых генераций. Тип: int. Дефолт: 2.
#   workers: 2
#
#   # queue-size — ёмкость очереди задач; переполнение → HTTP 503.
#   # Тип: int. Дефолт: 64.
#   queue-size: 64
#
#   # wait-timeout — таймаут режима wait=true (ожидания завершения всех
#   # ассетов до ответа). Тип: duration-строка. Дефолт: "300s".
#   wait-timeout: "300s"
