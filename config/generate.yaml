########################################
# Imager — слой GENERATE (генерация ассетов).
#
# Всё, что настраивается при работе над картинками: пресеты, policy,
# форматы/энкодеры, ресайз, watermark, ориентация, trim, цвет, detection.
# Меняется часто.
#
# Файл ОПЦИОНАЛЕН: если отсутствует — используются умолчания схемы.
# Переопределение: generate-local.yaml глубоко мержится поверх этого файла.
# Ключ version здесь опционален; если задан — только "1".
########################################
# version: "1"

########################################
# policy — deny-by-default политика разрешённых пресетов/customs.
#
# Всё запрещено по умолчанию; разрешается только то, что явно перечислено
# в path-policies. Политика применяется к ассет-URL вида
#   /{path}/{source_name}-{source_format}/{segment}@{dpr}.{output}
# где segment — ИМЯ ПРЕСЕТА или custom-имя (размер-грамматика).
# Transform-коды (c-, t-, ct-, sc-, fc-, oc-) в URL отсутствуют: операция
# (resize/crop/smart-crop/face-crop/object-crop) определяется ТОЛЬКО полем
# crop пресета/custom.
#
# Структура:
#   presets — глобальные именованные пресеты (на них ссылаются path-policies);
#   path-policies — MAP: ключ = префикс пути (longest-prefix match, "/" =
#   fallback), значение = {presets: [имена], customs: {имя: настройки}}.
#
# Ключ policy.global (authorization/allowed-presets/size-rules/limits) УДАЛЁН:
# лимиты перенесены в application.limits, а «safe/unsafe» и size-rules больше
# не существуют — разрешение определяется только path-policies (deny-by-default).
########################################
policy:
  # presets — именованные конфигурации обработки (ссылка из URL на пресет).
  # Каждый пресет:
  #   name (обязательный, ≤64 символов, без дефисов "-" в имени; допустимы
  #         буквы, цифры, "_", ".", "@" для суффикса @dpr; суффиксы @0/@1
  #         запрещены);
  #   width, height — размер (0 = не задан, вычисляется пропорционально);
  #   output-formats — МАССИВ допустимых выходных форматов (whitelist:
  #         jpeg | png | webp | gif | avif | heif | apng | jxl); непустой;
  #   dpr — НЕ задавать (ключ отсутствует) = dpr берётся из @dpr-суффикса URL;
  #         2/3 = фиксированный множитель размера (и @dpr в URL запрещён);
  #         явное 0/1 тоже считается «заданным» — @dpr в URL запрещён,
  #         множитель 1;
  #   crop (строка; по умолчанию "" = кроп не используется):
  #     ""        → resize (только изменение размера)
  #     "center"  → crop   (центрированная обрезка)
  #     "smart"   → smart-crop   (умная обрезка)
  #     "face"    → face-crop    (обрезка по лицу)
  #     "object"  → object-crop  (обрезка по объекту);
  #   trim (bool; по умолчанию false) — независимый фильтр обрезки
  #     однотонных полей. crop и trim — НЕЗАВИСИМЫЕ фильтры: сначала trim,
  #     затем кроп/ресайз. Фактическое применение определяется этой парой
  #     полей, в URL transform-код НЕ кодируется;
  #   quality — 0-100 (0 = default-quality из `processing`);
  #   frames — макс. число кадров анимации (0 = без ограничения);
  #   duration — макс. длительность анимации в мс (0 = без ограничения);
  #   loop — *bool: nil (не задано) = default-loop из processing;
  #          true = бесконечный loop, false = однопроходная анимация;
  #   watermark — имя ватермарки из секции watermarks (пусто = не задана;
  #         приоритет выше processing.default-watermark);
  #   auto-orient — *bool: nil (не задано) = наследовать глобальный дефолт
  #         processing.default-auto-orient; true/false — явно включить/выключить
  #         автоматический поворот по EXIF Orientation;
  #   rotate — фиксированный поворот по часовой стрелке:
  #         "" (не задано) = наследовать processing.default-rotate;
  #         "none" = ЯВНО отключить поворот (перекрыть глобальный);
  #         "90" | "180" | "270" — угол поворота;
  #   flip — отражение:
  #         "" (не задано) = наследовать processing.default-flip;
  #         "none" = ЯВНО отключить отражение (перекрыть глобальный);
  #         "horizontal" — зеркало слева-направо;
  #         "vertical" — отражение сверху-вниз.
  #   Ориентация применяется ДО resize/crop/trim (порядок: auto-orient →
  #   rotate → flip).
  # Имена пресетов должны быть УНИКАЛЬНЫМИ.
  presets:
    # пресет "thumb" — маленький resize-центра. dpr НЕ задан: в URL допустимы
    # thumb.webp (dpr=1), thumb@2.webp, thumb@3.webp.
    - name: "thumb"
      width: 200
      height: 200
      output-formats: [webp, avif]
      quality: 85

    # пресет "thumb@2" — версия 200x200 для экранов с DPR 2 (реально 400x400).
    # @2 в имени фиксирует dpr=2: в URL допустим ТОЛЬКО thumb@2.webp.
    - name: "thumb@2"
      width: 400
      height: 400
      output-formats: [webp, avif]
      quality: 85

    # пресет "banner" — анимационный WebP-баннер 1200x400. dpr не задан
    # (wildcard-@dpr из URL).
    - name: "banner"
      width: 1200        # 0 = не задан (вычисляется пропорционально)
      height: 400
      output-formats: [webp, avif]
      quality: 80        # 0 = default-quality
      frames: 0          # 0 = без ограничения кадров
      duration: 0        # 0 = без ограничения длительности
      loop: true         # зацикленная анимация (nil = по default-loop)

    # пресет "banner@2" — та же геометрия (ширина 2400 = 1200×2, высота
    # 800 = 400×2) для экранов с DPR 2. @2 в имени фиксирует dpr=2: в URL
    # допустим ТОЛЬКО /banners/.../banner@2.{webp|avif}.
    - name: "banner@2"
      width: 2400
      height: 800
      output-formats: [webp, avif]
      quality: 80
      frames: 0
      duration: 0
      loop: true

    # Примеры режимов crop/ориентации (раскомментируйте при необходимости):
    # - name: "avatar"          # центрированный кроп
    #   crop: center
    #   width: 100
    #   height: 100
    #   output-formats: [webp]
    #
    # - name: "hero"            # умный кроп (smart-crop)
    #   crop: smart
    #   width: 800
    #   height: 600
    #   output-formats: [webp]
    #
    # - name: "portrait"        # кроп по лицу + trim
    #   crop: face
    #   trim: true
    #   width: 300
    #   height: 300
    #   output-formats: [jpeg]
    #
    # - name: "product"         # кроп по объекту + trim
    #   crop: object
    #   trim: true
    #   width: 500
    #   height: 500
    #   output-formats: [webp]
    #
    # - name: "exif-strip"      # явная ориентация
    #   width: 0
    #   height: 1200
    #   output-formats: [jpeg]
    #   auto-orient: false
    #   rotate: "none"
    #   flip: horizontal

  # path-policies — политики по префиксам пути ассет-URL. MAP: ключ = путь
  # (префикс), значение = настройки пути.
  # Выбор: LONGEST prefix match (самый длинный совпадающий префикс побеждает).
  #   "basket/products" нормализуется в "/basket/products";
  #   "/" — fallback: применяется ко всем путям без более специфичного совпадения.
  # Поля:
  #   presets — список ИМЁН глобальных пресетов (policy.presets), доступных
  #             на этом пути (подмножество; неизвестное имя — ошибка старта);
  #   customs — MAP: ключ = custom-имя (размер-грамматика "x" / "x200" /
  #             200x / "200x200", опционально с @2/@3, например "200x100@2"),
  #             значение = настройки КАК У ПРЕСЕТОВ (width/height,
  #             output-formats и т.д.). Размер custom берётся из имени;
  #             настройки width/height имеют приоритет над именем.
  #   При разрешении segment-URL customs имеют приоритет над presets пути.
  #   deny-by-default: сегмент, не найденный ни в customs, ни в presets
  #   пути (и не покрытый "/"), отклоняется.
  path-policies:
    # "/" — fallback для всех путей. Разрешены пресеты thumb/thumb@2 и
    # custom-размеры из секции customs ниже.
    "/":
      presets: ["thumb", "thumb@2"]
      customs:
        # custom-имя = размер: "x" = оригинальный размер.
        x:
          crop: center              # настроек как у пресетов
          output-formats: [webp]
        # "x200" = только высота 200 (ширина пропорционально).
        x200:
          output-formats: [webp, avif]
        # "200x" = только ширина 200 (высота пропорционально).
        200x:
          output-formats: [webp]
        # "200x200" = точный размер; dpr не задан → допустимы 200x200.webp,
        # 200x200@2.webp, 200x200@3.webp.
        200x200:
          output-formats: [webp]

    # "/thumbs" — специфичный префикс: только пресет thumb и один custom.
    "/thumbs":
      presets: ["thumb"]
      customs:
        100x100:
          output-formats: [webp, avif]

    # "/banners" — баннеры: пресеты banner/banner@2 + кастомный вариант
    # 200x100 с явным @2 в имени (фиксирует dpr=2; в URL допустим только
    # 200x100@2.{webp|avif}).
    "/banners":
      presets: ["banner", "banner@2"]
      customs:
        200x100@2:
          output-formats: [webp, avif]

    # "/originals" — только custom "x" (оригинальный размер), все форматы.
    "/originals":
      customs:
        x:
          output-formats: [jpeg, png, webp, gif, avif, heif, apng, jxl]

    # "/admin" — отдельный путь с пресетом thumb.
    "/admin":
      presets: ["thumb"]

    # Примеры других path-policies (раскомментируйте при необходимости):
    # "/avatars":
    #   presets: ["avatar"]
    #   customs:
    #     100x100:
    #       output-formats: [webp, jpeg]
    # "/news":
    #   presets: ["hero"]
    #   customs:
    #     800x600:
    #       output-formats: [webp]

########################################
# watermarks — именованные декларации ватермарок.
#
# Ватермарка описывается ОДИН раз здесь и применяется по имени в пресетах
# (policy.presets[].watermark), customs (policy.path-policies.*.customs.*.watermark)
# или по умолчанию (processing.default-watermark).
#
# Приоритет применения: пресет/custom -> processing.default-watermark.
#
# Поля:
#   name     (обязательный) — уникальное имя для ссылок;
#   path     (обязательный) — путь к файлу изображения ватермарки на диске.
#              Файл должен существовать на старте (иначе — fail-fast).
#   position — позиция размещения (CSS background-position):
#              top | bottom | left | right | center. Дефолт: center.
#   repeat   — заполнение копиями (CSS background-repeat):
#              no-repeat | repeat | repeat-x | repeat-y | round | space.
#              Дефолт: no-repeat.
#   size     — размер копии относительно холста (CSS background-size):
#              contain | cover | "{width}px {height}px" (например "200px 50px").
#              Дефолт: contain.
#
# Ограничения движков:
#   - libvips реализует position/repeat/size полностью;
#   - анимированные выходы (GIF/WebP/APNG) с ватермаркой на libvips дают
#     ошибку обработки (композит применился бы только к первому кадру).
#
# Секция опциональна: без неё ни одна ватермарка не применяется.
########################################
watermarks: []
# Пример:
# watermarks:
#   - name: water-test
#     path: "/etc/imager/watermarks/test.png"
#     position: center        # top | bottom | left | right | center
#     repeat: no-repeat       # no-repeat | repeat | repeat-x | repeat-y | round | space
#     size: contain           # contain | cover | "200px 50px"

########################################
# application — прикладные лимиты генерации ассетов (перенесены сюда из
# policy.global.limits; ключ application.output-limit удалён — вместо него
# application.limits.output-bytes). Раньше задавались в policy.global.limits.
########################################
application:
  limits:
    # source-bytes — максимум размера ИСХОДНОГО файла (байт).
    # Тип: int64. 0 = без лимита.
    source-bytes: 10485760                    # 10 MiB

    # output-bytes — максимум размера ВЫХОДНОГО файла (байт).
    # Тип: int64. 0 = без лимита.
    output-bytes: 10485760                    # 10 MiB

    # width — максимум ширины запрошенного изображения (px).
    # width: 2000
    # height — максимум высоты запрошенного изображения (px).
    # height: 2000
    # pixels — максимум пикселей запрошенного изображения (wxh).
    # pixels: 4000000                            # 4 MP
    # dpr — максимум значения dpr в запросе (1/2/3).
    # dpr: 3
    # frames — максимум кадров анимации (для GIF/WebP).
    # frames: 150
    # duration — максимум длительности анимации (мс).
    # duration: 60000                            # 60 000 мс = 60 c
    # concurrency — максимум одновременных операций обработки от одного
    # клиента (int).
    # concurrency: 10
    # Примечание: параметры width/height/pixels/frames/dpr/duration/
    # concurrency не заданы в этом файле — 0 => без ограничения.
