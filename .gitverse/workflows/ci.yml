name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Публикация образа на Docker Hub (docker-release):
  # - release (published) — при публикации релиза (тег vX.Y.Z) берётся его tag_name;
  # - workflow_dispatch — ручной запуск с input imager_version (см. джобу ниже).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      imager_version:
        description: >-
          Версия релиза (например "v1.2.3" / "1.0.0") или "latest" —
          для "latest" версия резолвится в самый свежий тег (см. docker/lib.sh)
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  # Тесты: одна Linux-среда с полным набором build tags (libvips + onnx).
  # Это production-конфигурация (см. Makefile: TAGS ?= libvips onnx) — без
  # флагов тесты не покрывают реальные пути (CGO + libvips + onnx), поэтому
  # stub/onnx-комбинации и Windows-джобы убраны: пайплайн быстрее, а покрытие
  # не теряется (платформозависимые файлы _unix/_windows компилируются в
  # Linux-джобе через go vet/build всех пакетов).
  test:
    name: "libvips,onnx @ ubuntu-latest"
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install libvips (Linux)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: go vet
        run: go vet -tags="${TAGS}" ./...

      - name: go test
        run: go test -tags="${TAGS}" ./... -count=1

      # go test -race: race detector требует CGO (включён выше).
      - name: go test -race
        run: go test -race -tags="${TAGS}" ./... -count=1

      - name: Build cmd/imager
        run: go build -tags="${TAGS}" -trimpath -ldflags="-s -w" ./cmd/imager

  # Lint, format, govulncheck и fuzz smoke — не зависят от build tags,
  # поэтому объединены в одну джобу (после успешных тестов).
  quality:
    name: Lint, Format, Analysis & Fuzz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: fuzz smoke (FuzzParse)
        run: go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=10s ./domain/asset

      - name: fuzz smoke (FuzzParseSize)
        run: go test -run=^$ -fuzz=^FuzzParseSize$ -fuzztime=10s ./domain/asset

      - name: fuzz smoke (FuzzCleanRelContainment)
        run: go test -run=^$ -fuzz=^FuzzCleanRelContainment$ -fuzztime=10s ./adapters/storage/fs

  # Docker: сборка образа без push + сканирование уязвимостей.
  docker:
    name: Container build + scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t imager:ci .

      - name: Container scan (Trivy)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed imager:ci

  # Docker Hub Release: публикация altrap/imager (Docker Hub, НЕ репозиторий кода).
  # Триггеры:
  # - release (types: [published]) — автоматически при публикации релиза:
  #   берётся его tag_name (тег vX.Y.Z), собирается altrap/imager:X.Y.Z + latest;
  # - workflow_dispatch — ручной запуск из UI (CI → Run workflow) с input
  #   imager_version: конкретный тег ("v1.2.3" / "1.0.0") или "latest" (в таком
  #   случае версия резолвится в самый свежий тег тем же механизмом, что
  #   docker/lib.sh: resolve_release_version в Makefile).
  #
  # Секрет DOCKERHUB_TOKEN:
  #   создаётся в Docker Hub (Account Settings → Security → New Access Token,
  #   права Read & Write) и добавляется в GitVerse-репозиторий
  #   (Settings → Secrets). Без него push не пройдёт.
  #
  # Как проверить результат после прогона:
  #   docker pull altrap/imager:latest && docker run --rm altrap/imager:latest imager --version
  docker-release:
    name: Docker Hub Release
    runs-on: ubuntu-latest
    env:
      # Единая переменная для обоих триггеров. Выражение ниже работает так:
      # - при release: github.event.release.tag_name не пуст (напр. "v1.2.3");
      # - при workflow_dispatch: github.event.release отсутствует (null),
      #   tag_name пустой, поэтому `||` переключается на inputs.imager_version.
      IMAGER_VERSION: ${{ github.event.release.tag_name || inputs.imager_version }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      # Buildx-драйвер нужен для мультиплатформенных сборок (см. комментарий
      # ниже); для single-arch он безвреден и подготавливает будущее расширение.
      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин под учёткой altrap (это учётка Docker Hub, НЕ репозиторий кода).
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: altrap
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Сборка + публикация: теги altrap/imager:latest и altrap/imager:<VERSION_TAG>.
      # Makefile не делает ничего интерактивного, VERSION_TAG резолвится
      # через docker/lib.sh: resolve_release_version (см. Makefile).
      - name: Собрать и опубликовать образ
        run: |
          make docker-release IMAGER_VERSION="${IMAGER_VERSION}"
        env:
          IMAGER_VERSION: ${{ env.IMAGER_VERSION }}

  # --- Расширение на arm64 (на будущее) ---
  # Сейчас single-arch linux/amd64: fetcher-стадия Dockerfile скачивает
  # production-бинь под amd64 (docker/install-imager.sh, detect_arch из
  # docker/lib.sh), поэтому для мультиарх потребуется:
  #   1) docker/setup-qemu-action@v3 (до шага buildx) для эмуляции arm64;
  #   2) перенос сборки на buildx с --platform linux/amd64,linux/arm64
  #      (buildx build --push, единый manifest list);
  #   3) проверка, что install-imager.sh умеет скачивать arm64-бинь
  #      (docker/lib.sh: detect_arch уже есть; нужны arm64-артефакты в релизах)
  #      либо альтернативно сборка из исходников целиком.