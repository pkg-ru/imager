name: CI

on:
  push:
    branches: [master, main]
    # Публикация образа на Docker Hub (docker-release) выполняется ТОЛЬКО
    # при push нового тега вида vX.Y.Z (например v2.0.0) или при ручном
    # workflow_dispatch (см. условие джобы docker-release ниже).
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      imager_version:
        description: >-
          Версия релиза (например "v1.2.3" / "1.0.0") или "latest" —
          для "latest" версия резолвится в самый свежий тег (см. docker/lib.sh)
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Быстрый CI (Pull Request + push в master/main + release-теги + dispatch).
  #
  # Единственная джоба для обычного PR: gofmt (fail-fast) + go test с
  # production build tags (libvips,onnx). Race / govulncheck / fuzz /
  # docker build / trivy здесь НЕ выполняются — они перенесены в master/main,
  # release и nightly (см. ниже), т.к. для каждого PR они не нужны.
  #
  # gofmt и go test объединены в одну джобу: обе лёгкие, работают в одном
  # предварительно собранном CI-образе gitverse.ru/pkg-ru/imager-ci:v1
  # (Go 1.27 + libvips + onnxruntime + gofmt + предзагруженный GOMODCACHE).
  # Toolchain и зависимости НЕ устанавливаются в каждом запуске.
  # Тег образа фиксированный (immutable), не latest.
  #
  # go vet отдельной джобой не запускается: go test уже выполняет
  # соответствующие vet-проверки для тестируемых пакетов.
  # ===========================================================================
  fast-ci:
    name: "gofmt + go test (libvips,onnx)"
    runs-on: ubuntu-latest
    # PR, push в master/main, push тега v* и workflow_dispatch (release).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      # GOMODCACHE предзагружен в образ (go mod download при сборке образа);
      # исходники монтируются в /src, модули не скачиваются заново.
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Проверка форматирования: fail-fast, без автоматического форматирования.
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -tags="${TAGS}" ./... -count=1

  # ===========================================================================
  # Race detector: только master/main, release-теги и workflow_dispatch.
  # Не запускается на обычном PR (дорого, пользы как gate каждого PR мало).
  # ===========================================================================
  race:
    name: "go test -race (libvips,onnx)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go test -race: race detector требует CGO (включён выше).
      - name: go test -race
        run: go test -race -tags="${TAGS}" ./... -count=1

  # ===========================================================================
  # Security + production build: только master/main, release-теги и dispatch.
  #
  # govulncheck предустановлен в CI-образе (см. .gitverse/docker/imager-ci/),
  # поэтому go run ...@latest (скачивание+компиляция в каждом запуске) не нужен.
  #
  # go build с production build tags объединён сюда же: проверка быстрая,
  # отдельный runner/checkout для неё не нужен (меньше startup overhead).
  # ===========================================================================
  security:
    name: "govulncheck + go build"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: govulncheck
        run: govulncheck ./...

      - name: go build (production)
        run: go build -tags="${TAGS}" -trimpath -ldflags="-s -w" ./cmd/imager

  # ===========================================================================
  # Docker: сборка образа без push + сканирование уязвимостей (Trivy).
  # Только master/main, release-теги и workflow_dispatch (не PR).
  #
  # ВАЖНО (GitVerse): в отличие от GitHub Actions, на раннерах GitVerse Docker
  # daemon НЕ запущен по умолчанию (нет /var/run/docker.sock) — его нужно
  # поднимать явно перед любыми docker-командами (см. docker/start-dockerd.sh).
  # ===========================================================================
  docker:
    name: Container build + scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ВАЖНО (GitVerse): раннер работает внутри контейнера без NET_ADMIN —
      # dockerd запускается с --bridge=none (см. docker/start-dockerd.sh),
      # поэтому все docker-команды используют --network host.
      - name: Start Docker daemon
        run: sh docker/start-dockerd.sh

      - name: Build image
        run: docker build --network host -t imager:ci .

      - name: Container scan (Trivy)
        run: docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed imager:ci

  # ===========================================================================
  # Docker Hub Release: публикация altrap/imager (Docker Hub, НЕ репозиторий кода).
  # Триггеры:
  # - push тега v* (например v2.0.0) — автоматически при создании нового тега:
  #   берётся его имя (тег vX.Y.Z), собирается altrap/imager:X.Y.Z + latest;
  # - workflow_dispatch — ручной запуск из UI (CI → Run workflow) с input
  #   imager_version: конкретный тег ("v1.2.3" / "1.0.0") или "latest" (в таком
  #   случае версия резолвится в самый свежий тег тем же механизмом, что
  #   docker/lib.sh: resolve_release_version в Makefile).
  #
  # ИСПРАВЛЕНО: раньше условие разрешало только push+tag+created, из-за чего
  # workflow_dispatch фактически не проходил. Теперь оба сценария работают.
  # Публикация НЕ выполняется при обычном push в ветку (без тега).
  #
  # Джоба ждёт все проверки (fast-ci, race, security, docker), поэтому перед
  # публикацией гарантированно пройдены: тесты, race, govulncheck, go build,
  # docker build и trivy-скан (HIGH,CRITICAL, --ignore-unfixed).
  #
  # Секрет DOCKERHUB_TOKEN:
  #   создаётся в Docker Hub (Account Settings → Security → New Access Token,
  #   права Read & Write) и добавляется в GitVerse-репозиторий
  #   (Settings → Secrets). Без него push не пройдёт.
  #
  # Как проверить результат после прогона:
  #   docker pull altrap/imager:latest && docker run --rm altrap/imager:latest imager --version
  # ===========================================================================
  docker-release:
    name: Docker Hub Release
    runs-on: ubuntu-latest
    needs: [fast-ci, race, security, docker]
    # Только создание нового тега v* (push) или ручной запуск (workflow_dispatch).
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created) || github.event_name == 'workflow_dispatch'
    env:
      # Единая переменная для обоих триггеров. Выражение ниже работает так:
      # - при push тега: github.ref_name не пуст (напр. "v2.0.0");
      # - при workflow_dispatch: github.ref_name — ветка (напр. "master"),
      #   поэтому `||` переключается на inputs.imager_version.
      IMAGER_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.imager_version }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      # ВАЖНО (GitVerse): Docker daemon на раннерах GitVerse не запущен по
      # умолчанию (нет /var/run/docker.sock) — поднимаем его явно. Скрипт
      # идемпотентен и имеет fallback-и (systemd → dockerd в фоне).
      - name: Start Docker daemon
        run: sh docker/start-dockerd.sh

      # Логин под учёткой altrap (это учётка Docker Hub, НЕ репозиторий кода).
      # setup-buildx-action НЕ используется: сборка single-arch идёт обычным
      # `docker build` (make docker-release), а docker-container драйвер buildx
      # требует работающий daemon и не нужен для этого сценария.
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: altrap
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Сборка + публикация: теги altrap/imager:latest и altrap/imager:<VERSION_TAG>.
      # Makefile не делает ничего интерактивного, VERSION_TAG резолвится
      # через docker/lib.sh: resolve_release_version (см. Makefile).
      - name: Собрать и опубликовать образ
        run: |
          make docker-release IMAGER_VERSION="${IMAGER_VERSION}"
        env:
          IMAGER_VERSION: ${{ env.IMAGER_VERSION }}

  # --- Расширение на arm64 (на будущее) ---
  # Сейчас single-arch linux/amd64: fetcher-стадия Dockerfile скачивает
  # production-бинь под amd64 (docker/install-imager.sh, detect_arch из
  # docker/lib.sh), поэтому для мультиарх потребуется:
  #   1) docker/setup-qemu-action@v3 (до шага buildx) для эмуляции arm64;
  #   2) перенос сборки на buildx с --platform linux/amd64,linux/arm64
  #      (buildx build --push, единый manifest list);
  #   3) проверка, что install-imager.sh умеет скачивать arm64-бинь
  #      (docker/lib.sh: detect_arch уже есть; нужны arm64-артефакты в релизах)
  #      либо альтернативно сборка из исходников целиком.