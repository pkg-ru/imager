name: CI

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Быстрый CI (Pull Request + push в master/main + release-теги + dispatch).
  #
  # Единственная джоба для обычного PR: gofmt (fail-fast) + go test с
  # production build tags (libvips,onnx). Race / govulncheck / fuzz здесь
  # НЕ выполняются — они перенесены в master/main и nightly (см. ниже),
  # т.к. для каждого PR они не нужны.
  #
  # gofmt и go test объединены в одну джобу: обе лёгкие, работают в одном
  # предварительно собранном CI-образе gitverse.ru/pkg-ru/imager-ci:v1
  # (Go 1.27 + libvips + onnxruntime + gofmt + предзагруженный GOMODCACHE).
  # Toolchain и зависимости НЕ устанавливаются в каждом запуске.
  # Тег образа фиксированный (immutable), не latest.
  #
  # go vet отдельной джобой не запускается: go test уже выполняет
  # соответствующие vet-проверки для тестируемых пакетов.
  # ===========================================================================
  fast-ci:
    name: "gofmt + go test (libvips,onnx)"
    runs-on: ubuntu-latest
    # PR, push в master/main, push тега v* и workflow_dispatch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      # GOMODCACHE предзагружен в образ (go mod download при сборке образа);
      # исходники монтируются в /src, модули не скачиваются заново.
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Проверка форматирования: fail-fast, без автоматического форматирования.
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -tags="${TAGS}" ./... -count=1

  # ===========================================================================
  # Race detector: только master/main, release-теги и workflow_dispatch.
  # Не запускается на обычном PR (дорого, пользы как gate каждого PR мало).
  # ===========================================================================
  race:
    name: "go test -race (libvips,onnx)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go test -race: race detector требует CGO (включён выше).
      - name: go test -race
        run: go test -race -tags="${TAGS}" ./... -count=1

  # ===========================================================================
  # Security + production build: только master/main, release-теги и dispatch.
  #
  # govulncheck предустановлен в CI-образе (см. .gitverse/docker/imager-ci/),
  # поэтому go run ...@latest (скачивание+компиляция в каждом запуске) не нужен.
  #
  # go build с production build tags объединён сюда же: проверка быстрая,
  # отдельный runner/checkout для неё не нужен (меньше startup overhead).
  # ===========================================================================
  security:
    name: "govulncheck + go build"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    container:
      image: gitverse.ru/pkg-ru/imager-ci:v1
    env:
      CGO_ENABLED: "1"
      TAGS: "libvips,onnx"
      GOMODCACHE: /gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: govulncheck
        run: govulncheck ./...

      - name: go build (production)
        run: go build -tags="${TAGS}" -trimpath -ldflags="-s -w" ./cmd/imager

  # ===========================================================================
  # Docker-сборка и публикация altrap/imager на Docker Hub выполняются в
  # GitHub Actions (.github/workflows/docker-release.yml), а НЕ здесь.
  #
  # Причина: раннеры GitVerse работают в контейнере БЕЗ привилегий — нет
  # NET_ADMIN (нельзя создать docker0-bridge), нет mount-привилегий и unshare
  # (нельзя выполнять RUN-шаги Dockerfile). Docker-сборка на них невозможна
  # (проверено: dockerd, BuildKit, legacy builder и kaniko упираются в эти
  # ограничения). GitHub Actions использует полноценные VM, где docker build
  # и docker push работают штатно.
  #
  # GitHub — зеркало gitverse.ru/pkg-ru/imager: refs (ветки и теги)
  # синхронизирует .gitverse/workflows/mirror.yml, поэтому push тега v*
  # приходит в GitHub автоматически и запускает публикацию.
  # ===========================================================================